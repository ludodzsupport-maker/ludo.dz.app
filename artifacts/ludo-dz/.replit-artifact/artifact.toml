kind = "web"
previewPath = "/"
title = "Ludo DZ"
version = "1.0.0"
id = "artifacts/ludo-dz"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21341

[services.development]
run = "pnpm --filter @workspace/ludo-dz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ludo-dz", "run", "build" ]
serve = "static"
publicDir = "artifacts/ludo-dz/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21341"
BASE_PATH = "/"
