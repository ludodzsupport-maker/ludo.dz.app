<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" role="img" aria-labelledby="title desc">
  <title id="title">Ludo DZ splash artwork</title>
  <desc id="desc">A modern blue gradient splash illustration with Ludo pawns and dice.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="24" x2="384" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5FD8FF"/>
      <stop offset="0.48" stop-color="#2EB9F0"/>
      <stop offset="1" stop-color="#1267D8"/>
    </linearGradient>
    <linearGradient id="tile" x1="118" y1="102" x2="318" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#07518F" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="432" height="432" rx="96" fill="url(#bg)"/>
  <circle cx="74" cy="68" r="42" fill="#FFFFFF" opacity="0.16"/>
  <circle cx="372" cy="122" r="68" fill="#FFFFFF" opacity="0.11"/>
  <circle cx="346" cy="358" r="88" fill="#004EA8" opacity="0.16"/>

  <g filter="url(#shadow)">
    <rect x="106" y="96" width="220" height="220" rx="54" fill="url(#tile)"/>
    <path d="M216 96v220M106 206h220" stroke="#2EB9F0" stroke-width="14" stroke-linecap="round" opacity="0.18"/>

    <g transform="translate(214 204) rotate(-10) translate(-214 -204)">
      <rect x="154" y="144" width="120" height="120" rx="28" fill="#FFFFFF" stroke="#D1F2FF" stroke-width="8"/>
      <circle cx="188" cy="178" r="9" fill="#1267D8"/>
      <circle cx="240" cy="178" r="9" fill="#1267D8"/>
      <circle cx="214" cy="204" r="9" fill="#1267D8"/>
      <circle cx="188" cy="230" r="9" fill="#1267D8"/>
      <circle cx="240" cy="230" r="9" fill="#1267D8"/>
    </g>

    <g>
      <path d="M146 286c0-20 28-31 28-58 0-15-11-26-26-26s-26 11-26 26c0 27 28 38 28 58h-4z" fill="#FF4A5F"/>
      <ellipse cx="148" cy="288" rx="36" ry="15" fill="#C9163B"/>
      <circle cx="148" cy="196" r="26" fill="#FF6477"/>
    </g>

    <g>
      <path d="M280 286c0-20 28-31 28-58 0-15-11-26-26-26s-26 11-26 26c0 27 28 38 28 58h-4z" fill="#20C56E"/>
      <ellipse cx="282" cy="288" rx="36" ry="15" fill="#0B8D52"/>
      <circle cx="282" cy="196" r="26" fill="#37DE86"/>
    </g>
  </g>

  <text x="216" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="1">Ludo DZ</text>
