<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" role="img" aria-labelledby="title desc">
  <title id="title">Ludo DZ animated line-art splash</title>
  <desc id="desc">A minimal animated splash with premium line art: orbiting board path, dice outline, and abstract game-piece rings drawn over a blue gradient.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="24" x2="368" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37D7FF"/>
      <stop offset="0.5" stop-color="#2EB9F0"/>
      <stop offset="1" stop-color="#1D57C9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .draw {
        fill: none;
        stroke: #F7FCFF;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 620;
        stroke-dashoffset: 620;
        animation: drawLine 760ms cubic-bezier(.22,.8,.24,1) forwards;
      }

      .accent {
        stroke: #BFF4FF;
      }

      .fine {
        stroke-width: 3.5;
      }

      .medium {
        stroke-width: 6;
      }

      .delay-1 { animation-delay: 90ms; }
      .delay-2 { animation-delay: 180ms; }
      .delay-3 { animation-delay: 270ms; }
      .delay-4 { animation-delay: 360ms; }

      .mark {
        fill: #F7FCFF;
        opacity: 0;
        transform-origin: center;
        animation: pop 360ms cubic-bezier(.2,.9,.2,1.25) forwards;
      }

      .dot-1 { animation-delay: 620ms; }
      .dot-2 { animation-delay: 690ms; }
      .dot-3 { animation-delay: 760ms; }
      .dot-4 { animation-delay: 830ms; }

      .wordmark {
        fill: #F7FCFF;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 1.8px;
        opacity: 0;
        animation: fadeUp 420ms ease-out 760ms forwards;
      }

      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }

      @keyframes pop {
        0% { opacity: 0; transform: scale(.5); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: .96; transform: translateY(0); }
      }
    </style>
  </defs>

  <rect width="432" height="432" rx="96" fill="url(#bg)"/>
  <path d="M58 302C92 238 73 131 154 83c76-45 168-17 207 52 42 74 16 169-55 209-81 46-171 14-211-41" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="34"/>
  <path d="M339 73c26 20 43 46 53 78" fill="none" stroke="#BFF4FF" stroke-opacity=".22" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#glow)">
    <path class="draw medium" d="M110 216c0-58 47-105 105-105s105 47 105 105-47 105-105 105-105-47-105-105Z"/>
    <path class="draw fine accent delay-1" d="M156 126v180M274 126v180M125 157h180M125 275h180" opacity=".72"/>
    <path class="draw medium delay-2" d="M170 151h92c10 0 19 9 19 19v92c0 10-9 19-19 19h-92c-10 0-19-9-19-19v-92c0-10 9-19 19-19Z"/>
    <path class="draw fine accent delay-3" d="M165 323c-26 0-47-14-47-31s21-31 47-31 47 14 47 31-21 31-47 31Zm102-153c0-26 14-47 31-47s31 21 31 47-14 47-31 47-31-21-31-47Z" opacity=".82"/>
    <path class="draw fine delay-4" d="M134 107c22-16 49-25 81-25 74 0 134 60 134 134 0 31-10 59-28 82" opacity=".86"/>
  </g>

  <circle class="mark dot-1" cx="186" cy="186" r="6"/>
  <circle class="mark dot-2" cx="246" cy="186" r="6"/>
  <circle class="mark dot-3" cx="216" cy="216" r="6"/>
  <circle class="mark dot-4" cx="186" cy="246" r="6"/>
  <circle class="mark dot-4" cx="246" cy="246" r="6"/>

  <text class="wordmark" x="216" y="370" text-anchor="middle">Ludo DZ</text>
  <title id="title">Ludo DZ splash artwork</title>
  <desc id="desc">A modern blue gradient splash illustration with Ludo pawns and dice.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="24" x2="384" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5FD8FF"/>
      <stop offset="0.48" stop-color="#2EB9F0"/>
      <stop offset="1" stop-color="#1267D8"/>
    </linearGradient>
    <linearGradient id="tile" x1="118" y1="102" x2="318" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#07518F" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="432" height="432" rx="96" fill="url(#bg)"/>
  <circle cx="74" cy="68" r="42" fill="#FFFFFF" opacity="0.16"/>
  <circle cx="372" cy="122" r="68" fill="#FFFFFF" opacity="0.11"/>
  <circle cx="346" cy="358" r="88" fill="#004EA8" opacity="0.16"/>

  <g filter="url(#shadow)">
    <rect x="106" y="96" width="220" height="220" rx="54" fill="url(#tile)"/>
    <path d="M216 96v220M106 206h220" stroke="#2EB9F0" stroke-width="14" stroke-linecap="round" opacity="0.18"/>

    <g transform="translate(214 204) rotate(-10) translate(-214 -204)">
      <rect x="154" y="144" width="120" height="120" rx="28" fill="#FFFFFF" stroke="#D1F2FF" stroke-width="8"/>
      <circle cx="188" cy="178" r="9" fill="#1267D8"/>
      <circle cx="240" cy="178" r="9" fill="#1267D8"/>
      <circle cx="214" cy="204" r="9" fill="#1267D8"/>
      <circle cx="188" cy="230" r="9" fill="#1267D8"/>
      <circle cx="240" cy="230" r="9" fill="#1267D8"/>
    </g>

    <g>
      <path d="M146 286c0-20 28-31 28-58 0-15-11-26-26-26s-26 11-26 26c0 27 28 38 28 58h-4z" fill="#FF4A5F"/>
      <ellipse cx="148" cy="288" rx="36" ry="15" fill="#C9163B"/>
      <circle cx="148" cy="196" r="26" fill="#FF6477"/>
    </g>

    <g>
      <path d="M280 286c0-20 28-31 28-58 0-15-11-26-26-26s-26 11-26 26c0 27 28 38 28 58h-4z" fill="#20C56E"/>
      <ellipse cx="282" cy="288" rx="36" ry="15" fill="#0B8D52"/>
      <circle cx="282" cy="196" r="26" fill="#37DE86"/>
    </g>
  </g>

  <text x="216" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="1">Ludo DZ</text>
</svg>
